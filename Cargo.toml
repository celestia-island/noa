[package]
name = "libnoa"
version = "0.1.0"
edition = "2021"

authors = ["langyo <langyo.china@gmail.com>"]
description = "AI-native distributed version control system — agent workspace isolation, snapshots, and multi-remote sync"
license = "Apache-2.0"
repository = "https://github.com/celestia-island/noa"
documentation = "https://github.com/celestia-island/noa"
keywords = ["vcs", "version-control", "ai", "agent", "git"]
categories = ["development-tools", "command-line-utilities", "version-control"]

[[bin]]
name = "noa"
path = "bin/main.rs"

[[bin]]
name = "noa-server"
path = "bin/server.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
redb = "^2"

serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
rmp-serde = "^1"
toml = "^0.8"

clap = { version = "^4", features = ["derive"] }

sha2 = "^0.10"
hex = "^0.4"
base64 = "^0.22"

tokio = { version = "^1", features = ["full"] }
async-trait = "^0.1"

gix = "^0.84"

ignore = "^0.4"

axum = "^0.8"
tower = "^0.5"

aws-sdk-s3 = "^1"
aws-config = "^1"

anyhow = "^1"
thiserror = "^2"
chrono = "^0.4"
uuid = { version = "^1", features = ["v7"] }
tracing = "^0.1"
tracing-subscriber = "^0.3"

[dev-dependencies]
tempfile = "^3"
sha2 = "^0.10"

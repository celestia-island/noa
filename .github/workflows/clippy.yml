name: Clippy

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths:
      - '.github/workflows/clippy.yml'
      - 'src/**/*'
      - 'bin/**/*'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [master]

jobs:
  clippy:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds or audits on the org's self-hosted fleet), and a fork's run would
    # spend shared runner time on untrusted content. The two required checks
    # (commit lint, PR title) are the deliberate exception: they are
    # sub-minute, execute no pull request code, and hold no secrets.
    # A contributor who wants this suite can run it in their own fork, on
    # their own minutes.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Clippy
    runs-on: [self-hosted, linux, x64, local]
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - nightly

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Defensive mirror bypass: the runner env rewrites github.com/celestia-island/*
        # to local bare mirrors, which cannot reliably advertise PR merge refs
        # (GitHub advertises them sparsely), causing "not our ref" checkouts.
        env:
          GIT_CONFIG_COUNT: "0"

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: |
          cargo clippy \
            --all-targets \
            --all-features \
            --workspace \
            -- -D warnings

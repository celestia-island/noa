name: Clippy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/clippy.yml'
      - 'src/**/*'
      - 'bin/**/*'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [master, dev]

jobs:
  clippy:
    name: Clippy
    runs-on: [self-hosted, linux, x64, local]
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - nightly

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Defensive mirror bypass: the runner env rewrites github.com/celestia-island/*
        # to local bare mirrors, which cannot reliably advertise PR merge refs
        # (GitHub advertises them sparsely), causing "not our ref" checkouts.
        env:
          GIT_CONFIG_COUNT: "0"

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: |
          cargo clippy \
            --all-targets \
            --all-features \
            --workspace \
            -- -D warnings

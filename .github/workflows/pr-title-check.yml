# PR Title Check — validates PR titles against noa message rules.
# Installed by: noa hook install-action
# Requires: noa binary available in PATH (downloaded from GitHub Releases)
#
# The NOA_VERSION env var controls which release to fetch.
# Defaults to "latest".

name: PR Title Check

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review]

jobs:
  validate:
    # Org self-hosted runners: GitHub-hosted provisioning fails for private
    # repos under the org billing plan.
    runs-on: [self-hosted, linux, x64, local]
    permissions:
      contents: read
    steps:
      - name: Install noa
        id: install
        run: |
          set -euo pipefail
          VERSION="${NOA_VERSION:-latest}"
          if [ "$VERSION" = "latest" ]; then
            URL="https://github.com/celestia-island/noa/releases/latest/download/noa-linux-x86_64.tar.gz"
          else
            URL="https://github.com/celestia-island/noa/releases/download/${VERSION}/noa-linux-x86_64.tar.gz"
          fi
          if curl -fsSL "$URL" -o /tmp/noa.tar.gz \
              && tar -xzf /tmp/noa.tar.gz -C /usr/local/bin noa \
              && chmod +x /usr/local/bin/noa \
              && noa --version >/dev/null 2>&1; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::noa install failed (download, archive, permission or glibc incompatibility), skipping PR title check"
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check PR title
        # Dependabot PRs are exempt: machine-generated titles cannot satisfy
        # the gitmoji rules. The title is passed via env so user-controlled
        # input is never interpolated into shell syntax.
        if: steps.install.outputs.installed == 'true' && github.actor != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -o pipefail
          noa hook validate-msg -m "$PR_TITLE" -p celestia

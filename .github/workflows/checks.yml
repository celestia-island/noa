name: Code Checks

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Code Checks
    runs-on: [self-hosted, linux, x64, local]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      # Defensive mirror bypass: the runner env rewrites github.com/celestia-island/*
      # to local bare mirrors, which cannot reliably advertise PR merge refs
      # (GitHub advertises them sparsely), causing "not our ref" checkouts.
      env:
        GIT_CONFIG_COUNT: "0"

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2

    - name: Check import group ordering
      run: python3 scripts/utils/enforce_use_groups.py --test

    - name: Check markdown formatting
      run: python3 scripts/utils/format_markdown.py . --check

    - name: Format check
      run: cargo fmt --all -- --check

    - name: Compile check
      run: cargo check --workspace --all-targets

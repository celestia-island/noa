name: Security Audit

on:
  workflow_dispatch:
  push:
    branches: [master, dev]
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
  schedule:
    - cron: '0 6 * * 1'

jobs:
  audit:
    name: Cargo Audit
    runs-on: [self-hosted, linux, x64, local]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Defensive mirror bypass: the runner env rewrites github.com/celestia-island/*
        # to local bare mirrors, which cannot reliably advertise PR merge refs
        # (GitHub advertises them sparsely), causing "not our ref" checkouts.
        env:
          GIT_CONFIG_COUNT: "0"

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run audit
        run: cargo audit

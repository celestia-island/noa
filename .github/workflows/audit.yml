name: Security Audit

on:
  push:
    branches: [master, dev]
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
  schedule:
    - cron: '0 6 * * 1'

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run audit
        run: cargo audit

name: Test

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths:
      - '.github/workflows/test.yml'
      - 'src/**/*'
      - 'bin/**/*'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [master]

jobs:
  test:
    name: Test (${{ matrix.toolchain }}, ${{ matrix.os }})
    runs-on: [self-hosted, linux, x64, local]

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        toolchain: [stable, nightly]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Defensive mirror bypass: the runner env rewrites github.com/celestia-island/*
        # to local bare mirrors, which cannot reliably advertise PR merge refs
        # (GitHub advertises them sparsely), causing "not our ref" checkouts.
        env:
          GIT_CONFIG_COUNT: "0"

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        shell: bash
        run: cargo test --all-features --no-fail-fast

  test-official:
    name: Test (${{ matrix.toolchain }}, ${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        toolchain: [stable, nightly]
        include:
          - os: windows-latest
            toolchain: stable

    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        shell: bash
        run: cargo test --all-features --no-fail-fast

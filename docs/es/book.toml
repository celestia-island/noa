[book]
title = "Documentación de Noa"
description = "Sistema de control de versiones distribuido nativo de IA — aislamiento de espacio de trabajo por agente, registros JSONL de solo inserción, historial basado en instantáneas, compatibilidad total con el protocolo git"
authors = ["celestia-island"]
language = "es"
src = "."

[build]
build-dir = "../../target/docs/es"

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/celestia-island/noa"
edit-url-template = "https://github.com/celestia-island/noa/edit/dev/docs/es/{path}"
additional-js = ["../theme/lang-switcher.js"]
additional-css = ["../theme/lang-switcher.css"]

[book]
title = "وثائق Noa"
description = "نظام تحكم في الإصدارات موزع أصيل للذكاء الاصطناعي —— عزل مساحة العمل لكل وكيل، وسجلات JSONL للإلحاق فقط، وتاريخ قائم على اللقطات، وتوافق كامل مع بروتوكول git"
authors = ["celestia-island"]
language = "ar"
src = "."

[build]
build-dir = "../../target/docs/ar"

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/celestia-island/noa"
edit-url-template = "https://github.com/celestia-island/noa/edit/dev/docs/ar/{path}"
additional-js = ["../theme/lang-switcher.js"]
additional-css = ["../theme/lang-switcher.css"]

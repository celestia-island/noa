[book]
title = "Noa 文件"
description = "AI 原生的分散式版本控制系統 —— 每代理工作區隔離、JSONL 僅附加日誌、基於快照的歷史、完整的 git 協定相容性"
authors = ["celestia-island"]
language = "zh-TW"
src = "."

[build]
build-dir = "../../target/docs/zht"

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/celestia-island/noa"
edit-url-template = "https://github.com/celestia-island/noa/edit/dev/docs/zht/{path}"
additional-js = ["../theme/lang-switcher.js"]
additional-css = ["../theme/lang-switcher.css"]
